[project]
name = "gpt-exporter"
version = "2.10.0"
description = "Multi Social Network Explorer (MSNE): local multi-provider conversation archiver, exporter, indexer, and browser"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
  { name = "Bruno Kerouanton" },
]
dependencies = [
  "markdown-it-py>=4.0,<5",
  "python-docx>=1.2,<2",
  "Pillow>=11,<13",
]

[project.urls]
Repository = "https://github.com/kerouanton/Multi_Social_Network_Explorer"
Issues = "https://github.com/kerouanton/Multi_Social_Network_Explorer/issues"

[tool.gpt-exporter]
archive-directory = "~/Documents/ChatGPT Archive"
