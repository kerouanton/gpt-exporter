[project]
name = "gpt-exporter"
version = "2.8"
description = "GUI-first local archiver, exporter, indexer, and browser for ChatGPT conversations"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
  { name = "Bruno Kerouanton" },
]
dependencies = [
  "markdown-it-py>=4.0,<5",
  "python-docx>=1.2,<2",
  "Pillow>=11,<13",
]

[project.urls]
Repository = "https://github.com/kerouanton/gpt-exporter"
Issues = "https://github.com/kerouanton/gpt-exporter/issues"

[tool.gpt-exporter]
archive-directory = "~/Documents/ChatGPT Archive"
