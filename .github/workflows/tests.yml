name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-provider-namespace:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'refactor/remove-provider-namespace-shim' && github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    steps:
      - name: Check out provider cleanup branch
        uses: actions/checkout@v6
        with:
          ref: refactor/remove-provider-namespace-shim
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply namespace migration
        run: python tools/_finalize_provider_namespace.py

      - name: Install dependencies and provider distributions
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e packages/export-provider-chatgpt -e packages/export-provider-discord

      - name: Run full unit suite before committing
        run: python -m unittest discover -s tests -v

      - name: Commit verified migration without CI scaffolding
        shell: pwsh
        run: |
          Remove-Item tools/_finalize_provider_namespace.py
          Remove-Item .github/workflows/finalize-provider-namespace.yml
          git checkout origin/main -- .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retarget all legacy provider namespace imports"
          git push origin HEAD:refactor/remove-provider-namespace-shim

  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and provider distributions
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e packages/export-provider-chatgpt -e packages/export-provider-discord

      - name: Compile Python sources
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.py -File | ForEach-Object { $_.FullName }
          python -m py_compile $files

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project metadata
        run: python -c "import pathlib, tomllib; from gpt_exporter.version import __version__; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); p=data['project']; assert p['name']=='gpt-exporter'; assert p['version']==__version__; assert p['license']=='GPL-3.0-or-later'; print('pyproject metadata OK')"
