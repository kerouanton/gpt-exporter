name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.py -File | ForEach-Object { $_.FullName }
          python -m py_compile $files

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project metadata
        run: python -c "import pathlib, tomllib; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); p=data['project']; assert p['name']=='gpt-exporter'; assert p['version']=='2.7'; assert p['license']=='GPL-3.0-or-later'; print('pyproject metadata OK')"
