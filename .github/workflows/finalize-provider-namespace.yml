name: Finalize provider namespace

on:
  push:
    branches:
      - refactor/remove-provider-namespace-shim
    paths:
      - tools/_finalize_provider_namespace.py
      - .github/workflows/finalize-provider-namespace.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/remove-provider-namespace-shim
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply namespace migration
        run: python tools/_finalize_provider_namespace.py

      - name: Install dependencies and provider distributions
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e packages/export-provider-chatgpt -e packages/export-provider-discord

      - name: Run full unit suite before committing
        run: python -m unittest discover -s tests -v

      - name: Remove temporary finalizer and commit verified migration
        shell: pwsh
        run: |
          Remove-Item tools/_finalize_provider_namespace.py
          Remove-Item .github/workflows/finalize-provider-namespace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retarget all legacy provider namespace imports"
          git push origin HEAD:refactor/remove-provider-namespace-shim
