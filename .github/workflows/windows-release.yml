name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gpt_exporter/version.py

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            packages/export-provider-chatgpt/pyproject.toml
            packages/export-provider-discord/pyproject.toml

      - name: Determine release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from gpt_exporter.version import __version__; print(__version__)"
          if ($version -match "(?:dev|a|b|rc)") {
              Write-Host "Development/pre-release version '$version'; no final GitHub release will be published."
              "release=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Final release $tag already exists; this version.py change does not create a new release."
              "release=false" >> $env:GITHUB_OUTPUT
              "version=$version" >> $env:GITHUB_OUTPUT
              "tag=$tag" >> $env:GITHUB_OUTPUT
              exit 0
          }

          "release=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $productName = python -c "from gpt_exporter.version import APP_NAME; print(APP_NAME)"
          Write-Host "Preparing $productName v$version"

      - name: Install build dependencies and provider distributions
        if: steps.version.outputs.release == 'true'
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e packages/export-provider-chatgpt -e packages/export-provider-discord

      - name: Verify provider entry points before freezing
        if: steps.version.outputs.release == 'true'
        run: |
          python -c "from importlib.metadata import entry_points; eps={ep.name:ep.value for ep in entry_points(group='gpt_exporter.provider_plugins')}; assert eps['gpt']=='export_provider_chatgpt.plugin:create_provider'; assert eps['discord']=='export_provider_discord.plugin:create_provider'; print(eps)"

      - name: Run unit tests
        if: steps.version.outputs.release == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows onedir application
        if: steps.version.outputs.release == 'true'
        run: python -m PyInstaller --noconfirm --clean packaging/gpt_exporter.spec

      - name: Verify release build
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $exe = ".\dist\GPT Exporter\GPT Exporter.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
              throw "Executable was not produced: $exe"
          }

          $expectedName = python -c "from gpt_exporter.version import APP_NAME; print(APP_NAME)"
          $expectedLegacyName = python -c "from gpt_exporter.version import LEGACY_APP_NAME; print(LEGACY_APP_NAME)"
          $expectedVersion = python -c "from gpt_exporter.version import display_version; print(display_version())"
          $expectedNumeric = python -c "from gpt_exporter.version import windows_version_tuple; print('.'.join(map(str, windows_version_tuple())))"
          $info = (Get-Item $exe).VersionInfo

          if ($info.ProductName -ne $expectedName) {
              throw "Unexpected ProductName: '$($info.ProductName)'"
          }
          if ($info.FileDescription -ne $expectedName) {
              throw "Unexpected FileDescription: '$($info.FileDescription)'"
          }
          if ($info.ProductVersion -ne $expectedVersion) {
              throw "Unexpected ProductVersion: '$($info.ProductVersion)'"
          }
          if ($info.FileVersion -ne $expectedVersion) {
              throw "Unexpected FileVersion string: '$($info.FileVersion)'"
          }
          if ($info.OriginalFilename -ne "$expectedLegacyName.exe") {
              throw "Unexpected OriginalFilename: '$($info.OriginalFilename)'"
          }

          $actualNumeric = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
          if ($actualNumeric -ne $expectedNumeric) {
              throw "Unexpected fixed file version: '$actualNumeric' (expected '$expectedNumeric')"
          }

          python -c "import pefile; p=pefile.PE(r'dist\GPT Exporter\GPT Exporter.exe', fast_load=True); assert p.OPTIONAL_HEADER.Subsystem == 2, f'Expected Windows GUI subsystem (2), got {p.OPTIONAL_HEADER.Subsystem}'; print('Windowed PE subsystem OK')"

          $internalRoot = ".\dist\GPT Exporter\_internal"
          $genericResourceRoot = Join-Path $internalRoot "gpt_exporter\resources"
          foreach ($name in @("HELP.md", "HISTORY.md")) {
              $path = Join-Path $genericResourceRoot $name
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required packaged resource is missing: $path"
              }
              if ((Get-Item $path).Length -le 0) {
                  throw "Required packaged resource is empty: $path"
              }
          }

          $collectors = @(
              (Join-Path $internalRoot "export_provider_chatgpt\resources\collect_chatgpt_archive.js"),
              (Join-Path $internalRoot "export_provider_discord\resources\export_current_dm.js")
          )
          foreach ($collector in $collectors) {
              if (-not (Test-Path $collector -PathType Leaf)) {
                  throw "Required provider resource is missing: $collector"
              }
              if ((Get-Item $collector).Length -le 0) {
                  throw "Required provider resource is empty: $collector"
              }
          }

          $metadataRoots = @()
          $metadataRoots += Get-ChildItem $internalRoot -Directory -Filter "export_provider_chatgpt-*.dist-info"
          $metadataRoots += Get-ChildItem $internalRoot -Directory -Filter "export_provider_discord-*.dist-info"
          if ($metadataRoots.Count -ne 2) {
              throw "Expected two provider distribution metadata directories, found $($metadataRoots.Count)"
          }
          foreach ($metadataRoot in $metadataRoots) {
              $entryPoints = Join-Path $metadataRoot.FullName "entry_points.txt"
              if (-not (Test-Path $entryPoints -PathType Leaf)) {
                  throw "Provider entry-point metadata is missing: $entryPoints"
              }
          }

          if (-not (Test-Path ".\LICENSE" -PathType Leaf)) {
              throw "Repository LICENSE is missing."
          }
          if ((Get-Item ".\LICENSE").Length -le 0) {
              throw "Repository LICENSE is empty."
          }

          Write-Host "Release build verified: $expectedName $expectedVersion (legacy executable basename: $expectedLegacyName)"

      - name: Create release archive and checksum
        if: steps.version.outputs.release == 'true'
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "GPT-Exporter-$version-Windows-x64.zip"
          $checksum = "$zip.sha256"

          Remove-Item $zip, $checksum -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path ".\dist\GPT Exporter", ".\LICENSE" -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path $checksum -Encoding ascii

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          Write-Host "Release archive: $zip"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "${{ steps.package.outputs.zip }}"
          $checksum = "${{ steps.package.outputs.checksum }}"
          $repo = $env:GITHUB_REPOSITORY
          $productName = python -c "from gpt_exporter.version import APP_NAME; print(APP_NAME)"

          gh release create $tag $zip $checksum `
              --repo $repo `
              --target $env:GITHUB_SHA `
              --title "$productName v$version" `
              --notes-file "docs/RELEASE_NOTES_V2.9.md"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to create GitHub release $tag"
          }

          Write-Host "Published GitHub release $tag"
