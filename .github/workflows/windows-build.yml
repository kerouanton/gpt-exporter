name: Windows onedir build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            packages/export-provider-chatgpt/pyproject.toml
            packages/export-provider-discord/pyproject.toml

      - name: Install build dependencies and provider distributions
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e packages/export-provider-chatgpt -e packages/export-provider-discord

      - name: Verify provider entry points before freezing
        run: |
          python -c "from importlib.metadata import entry_points; eps={ep.name:ep.value for ep in entry_points(group='gpt_exporter.provider_plugins')}; assert eps['gpt']=='export_provider_chatgpt.plugin:create_provider'; assert eps['discord']=='export_provider_discord.plugin:create_provider'; print(eps)"

      - name: Build Windows onedir application
        run: python -m PyInstaller --noconfirm --clean packaging/gpt_exporter.spec

      - name: Verify canonical and legacy windowed executables
        shell: pwsh
        run: |
          $productName = python -c "from gpt_exporter.version import APP_NAME; print(APP_NAME)"
          $canonicalBase = python -c "from gpt_exporter.version import WINDOWS_CANONICAL_BASENAME; print(WINDOWS_CANONICAL_BASENAME)"
          $legacyBase = python -c "from gpt_exporter.version import WINDOWS_LEGACY_BASENAME; print(WINDOWS_LEGACY_BASENAME)"
          $onedirName = python -c "from gpt_exporter.version import WINDOWS_ONEDIR_NAME; print(WINDOWS_ONEDIR_NAME)"
          $expectedVersion = python -c "from gpt_exporter.version import display_version; print(display_version())"
          $expectedNumeric = python -c "from gpt_exporter.version import windows_version_tuple; print('.'.join(map(str, windows_version_tuple())))"

          $onedir = Join-Path ".\dist" $onedirName
          $executables = @(
              @{ Path = (Join-Path $onedir "$canonicalBase.exe"); Original = "$canonicalBase.exe"; Kind = "canonical" },
              @{ Path = (Join-Path $onedir "$legacyBase.exe"); Original = "$legacyBase.exe"; Kind = "legacy compatibility" }
          )

          foreach ($entry in $executables) {
              $exe = $entry.Path
              if (-not (Test-Path $exe -PathType Leaf)) {
                  throw "$($entry.Kind) executable was not produced: $exe"
              }
              if ((Get-Item $exe).Length -le 0) {
                  throw "$($entry.Kind) executable is empty: $exe"
              }

              $info = (Get-Item $exe).VersionInfo
              if ($info.ProductName -ne $productName) {
                  throw "Unexpected ProductName for $exe: '$($info.ProductName)'"
              }
              if ($info.FileDescription -ne $productName) {
                  throw "Unexpected FileDescription for $exe: '$($info.FileDescription)'"
              }
              if ($info.InternalName -ne $canonicalBase) {
                  throw "Unexpected InternalName for $exe: '$($info.InternalName)'"
              }
              if ($info.OriginalFilename -ne $entry.Original) {
                  throw "Unexpected OriginalFilename for $exe: '$($info.OriginalFilename)'"
              }
              if ($info.ProductVersion -ne $expectedVersion) {
                  throw "Unexpected ProductVersion for $exe: '$($info.ProductVersion)'"
              }
              if ($info.FileVersion -ne $expectedVersion) {
                  throw "Unexpected FileVersion string for $exe: '$($info.FileVersion)'"
              }

              $actualNumeric = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
              if ($actualNumeric -ne $expectedNumeric) {
                  throw "Unexpected fixed file version for $exe: '$actualNumeric' (expected '$expectedNumeric')"
              }
          }

          python -c "import pefile; from pathlib import Path; from gpt_exporter.version import WINDOWS_CANONICAL_BASENAME, WINDOWS_LEGACY_BASENAME, WINDOWS_ONEDIR_NAME; root=Path('dist')/WINDOWS_ONEDIR_NAME; paths=[root/f'{WINDOWS_CANONICAL_BASENAME}.exe', root/f'{WINDOWS_LEGACY_BASENAME}.exe']; [(lambda p: (_ for _ in ()).throw(AssertionError(f'Expected Windows GUI subsystem (2) for {p}, got {pefile.PE(str(p), fast_load=True).OPTIONAL_HEADER.Subsystem}')) if pefile.PE(str(p), fast_load=True).OPTIONAL_HEADER.Subsystem != 2 else None)(p) for p in paths]; print('Canonical and legacy windowed PE subsystems OK')"
          Write-Host "Windows executable migration OK: $canonicalBase.exe canonical, $legacyBase.exe compatibility, folder '$onedirName'"

      - name: Verify packaged resources and provider metadata
        shell: pwsh
        run: |
          $onedirName = python -c "from gpt_exporter.version import WINDOWS_ONEDIR_NAME; print(WINDOWS_ONEDIR_NAME)"
          $internalRoot = Join-Path (Join-Path ".\dist" $onedirName) "_internal"
          $genericResourceRoot = Join-Path $internalRoot "gpt_exporter\resources"
          foreach ($name in @("HELP.md", "HISTORY.md")) {
              $path = Join-Path $genericResourceRoot $name
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required packaged resource is missing: $path"
              }
              if ((Get-Item $path).Length -le 0) {
                  throw "Required packaged resource is empty: $path"
              }
          }

          $collectors = @(
              (Join-Path $internalRoot "export_provider_chatgpt\resources\collect_chatgpt_archive.js"),
              (Join-Path $internalRoot "export_provider_discord\resources\export_current_dm.js")
          )
          foreach ($collector in $collectors) {
              if (-not (Test-Path $collector -PathType Leaf)) {
                  throw "Required provider collector resource is missing: $collector"
              }
              if ((Get-Item $collector).Length -le 0) {
                  throw "Required provider collector resource is empty: $collector"
              }
          }

          $metadataRoots = @()
          $metadataRoots += Get-ChildItem $internalRoot -Directory -Filter "export_provider_chatgpt-*.dist-info"
          $metadataRoots += Get-ChildItem $internalRoot -Directory -Filter "export_provider_discord-*.dist-info"
          if ($metadataRoots.Count -ne 2) {
              throw "Expected two provider distribution metadata directories, found $($metadataRoots.Count)"
          }
          foreach ($metadataRoot in $metadataRoots) {
              $entryPoints = Join-Path $metadataRoot.FullName "entry_points.txt"
              if (-not (Test-Path $entryPoints -PathType Leaf)) {
                  throw "Provider entry-point metadata is missing: $entryPoints"
              }
          }

          Write-Host "Packaged extracted-provider resources and metadata OK"

      - name: Upload Windows onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSNE-Windows-onedir
          path: dist/GPT Exporter/
          if-no-files-found: error
          retention-days: 14
